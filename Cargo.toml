[package]
name = "cargo-accelerate"
version = "0.1.0"
edition = "2021"
description = "A CLI tool to automatically optimize Rust projects"
authors = ["Gemini CLI"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
toml = "1.1"
toml_edit = "0.25"
anyhow = "1.0"
colored = "3.1"
which = "8.0"
walkdir = "2.4"
cargo_metadata = "0.23"
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.8"

[profile]

[profile.dev]
incremental = true
opt-level = 0
debug = 1
codegen-units = 256
