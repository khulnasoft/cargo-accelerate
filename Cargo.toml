[package]
name = "cargo-accelerate"
version = "0.1.0"
edition = "2021"
description = "A CLI tool to automatically optimize Rust projects"
authors = ["Gemini CLI"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
anyhow = "1.0"
colored = "2.0"
which = "6.0"
walkdir = "2.4"
cargo_metadata = "0.18"
notify = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.8"

[profile]

[profile.dev]
incremental = true
opt-level = 0
debug = 1
codegen-units = 256
